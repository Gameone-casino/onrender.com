<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 56" width="250" height="56" role="img" aria-label="Gameone">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="0.5" stop-color="#f5b64a"/>
      <stop offset="1" stop-color="#d98a1f"/>
    </linearGradient>
  </defs>
  <!-- chip mark -->
  <g transform="translate(6,6)">
    <circle cx="22" cy="22" r="21" fill="#0e0e12" stroke="url(#gold)" stroke-width="2.5"/>
    <circle cx="22" cy="22" r="13" fill="none" stroke="url(#gold)" stroke-width="1.6" stroke-dasharray="3 4"/>
    <text x="22" y="30" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="18" font-weight="900" fill="url(#gold)">G</text>
  </g>
  <!-- wordmark: Game (white) + one (gold), written together -->
  <text x="60" y="37" font-family="'Segoe UI', Arial, sans-serif" font-size="27" font-weight="800" letter-spacing="0.3">
    <tspan fill="#ffffff">Game</tspan><tspan fill="url(#gold)">one</tspan>
  </text>
</svg>
